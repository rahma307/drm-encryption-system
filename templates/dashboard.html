{% extends "base.html" %}
{% block title %}Dashboard — SecureDRM{% endblock %}
{% block content %}

<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;">
    <div>
        <div style="font-family:var(--mono); font-size:0.65rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:6px;">SecureDRM / Dashboard</div>
        <h1 id="welcome-msg">Welcome</h1>
    </div>
    <div style="display:flex; gap:10px;">
        <a href="/encrypt" class="btn">🔒 Encrypt File</a>
        <a href="/decrypt" class="btn btn-ghost">🔓 Decrypt</a>
    </div>
</div>

<div class="grid-3" style="margin-bottom:24px;">
    <div class="stat-card">
        <div class="stat-label">Total Licenses</div>
        <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Active Licenses</div>
        <div class="stat-value" id="stat-active" style="color:var(--green)">—</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Your Device ID</div>
        <div class="stat-value" style="font-size:0.7rem; word-break:break-all; line-height:1.4;" id="stat-device">—</div>
    </div>
</div>

<div class="card" style="padding:0; overflow:hidden;">
    <div style="padding:18px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;">
        <h2 style="margin:0; color:var(--text); font-size:0.9rem;">Your Licenses</h2>
        <button class="btn btn-ghost" style="font-size:0.75rem; padding:5px 12px;" onclick="loadLicenses()">↻ Refresh</button>
    </div>
    <div id="licenses-container" style="padding:20px;">
        <div style="text-align:center; color:var(--text-dim); padding:40px;">Loading...</div>
    </div>
</div>

<div id="device-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; align-items:center; justify-content:center;">
    <div class="card" style="width:90%; max-width:480px; margin:0;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
            <h2 style="margin:0; font-size:1rem;">Manage Devices</h2>
            <button onclick="closeDeviceModal()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.2rem;">✕</button>
        </div>
        <div style="font-family:var(--mono); font-size:0.7rem; margin-bottom:16px;">
            License: <span id="modal-license-id" style="color:var(--accent)"></span>
        </div>
        <div id="modal-devices-list" style="margin-bottom:20px;"></div>
        <div style="border-top:1px solid var(--border); padding-top:16px;">
            <label style="margin-bottom:8px;">Add New Device</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="new-device-input" placeholder="device_id" style="flex:1;">
                <button class="btn" onclick="addDevice()" style="white-space:nowrap; padding:8px 16px;">Add</button>
            </div>
            <button class="btn btn-ghost" onclick="addCurrentDevice()" style="width:100%; margin-top:10px;">
                📱 Add My Current Device
            </button>
        </div>
    </div>
</div>

<script>
function getDeviceId() {
    let id = localStorage.getItem('device_id');
    if (!id) {
        const rand = crypto.getRandomValues(new Uint8Array(12));
        id = 'dev_' + Array.from(rand).map(b => b.toString(16).padStart(2,'0')).join('');
        localStorage.setItem('device_id', id);
    }
    return id;
}

async function computeDeviceFingerprint() {
    const existing = localStorage.getItem('device_fingerprint');
    if (existing) return existing;
    
    let fingerprint = getDeviceId();
    localStorage.setItem('device_fingerprint', fingerprint);
    return fingerprint;
}

let currentDeviceId = '';
let activeLicenseId = '';

function requireAuth() {
    if (!localStorage.getItem('session_token')) {
        window.location.href = '/login';
        return false;
    }
    return true;
}

function getHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('session_token') };
}

async function loadLicenses() {
    if (!requireAuth()) return;
    try {
        const res = await fetch('/api/user/licenses', { headers: getHeaders() });
        if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; return; }
        const data = await res.json();
        renderLicenses(data.licenses || []);
        updateStats(data.licenses || []);
    } catch(e) {
        document.getElementById('licenses-container').innerHTML = '<p style="color:var(--red);">Error loading data</p>';
    }
}

function updateStats(licenses) {
    document.getElementById('stat-total').textContent = licenses.length;
    document.getElementById('stat-active').textContent = licenses.filter(l => l.status === 'active').length;
    // Show FULL device ID
    document.getElementById('stat-device').textContent = currentDeviceId;
}

function statusBadge(status) {
    const map = {
        active: ['badge-green', 'Active'],
        expired: ['badge-red', 'Expired'],
        revoked: ['badge-red', 'Revoked'],
        inactive: ['badge-yellow', 'Inactive'],
        exhausted: ['badge-red', 'Exhausted']
    };
    const [cls, label] = map[status] || ['badge-blue', status];
    return `<span class="badge ${cls}">${label}</span>`;
}

function renderLicenses(licenses) {
    const el = document.getElementById('licenses-container');
    if (!licenses.length) {
        el.innerHTML = `<div style="text-align:center; padding:48px;">
            <div style="font-size:2rem; margin-bottom:12px;">📭</div>
            <div>No licenses yet</div>
            <a href="/encrypt" class="btn" style="margin-top:20px;">Encrypt a file</a>
        </div>`;
        return;
    }

    const rows = licenses.map(l => {
        const exp = l.expires_at ? new Date(l.expires_at).toLocaleDateString() : '—';
        const uses = l.max_uses === null ? '∞' : `${l.uses_remaining}/${l.max_uses}`;
        const devCount = (l.authorized_devices || []).length;
        const devLabel = devCount === 0 ? 'Floating' : `${devCount} device(s)`;

        return `<tr>
            <td><code>${l.license_id}</code></td>
            <td>${l.file_name || '—'}</td>
            <td>${exp}</td>
            <td>${uses}</td>
            <td>${devLabel}</td>
            <td>${statusBadge(l.status)}</td>
            <td>
                <div style="display:flex; gap:6px;">
                    <button class="btn btn-ghost" style="padding:4px 10px; font-size:0.7rem;" onclick="openDeviceModal('${l.license_id}', ${JSON.stringify(l.authorized_devices || []).replace(/"/g, '&quot;')})">
                        📱 Devices
                    </button>
                    ${l.status === 'active' ? `<button class="btn btn-danger" style="padding:4px 10px; font-size:0.7rem;" onclick="revokeLicense('${l.license_id}')">Revoke</button>` : ''}
                </div>
            </td>
        </tr>`;
    }).join('');

    el.innerHTML = `<div style="overflow-x:auto;">
        <table><thead><tr>
            <th>License ID</th><th>File</th><th>Expires</th><th>Uses</th><th>Devices</th><th>Status</th><th>Actions</th>
        </tr></thead><tbody>${rows}</tbody></table>
    </div>`;
}

function openDeviceModal(licenseId, devices) {
    activeLicenseId = licenseId;
    document.getElementById('modal-license-id').textContent = licenseId;
    renderModalDevices(devices);
    document.getElementById('device-modal').style.display = 'flex';
}

function closeDeviceModal() {
    document.getElementById('device-modal').style.display = 'none';
    activeLicenseId = '';
    loadLicenses();
}

function renderModalDevices(devices) {
    const el = document.getElementById('modal-devices-list');
    if (!devices.length) {
        el.innerHTML = '<div style="padding:12px 0; color:var(--text-dim);">No devices bound (floating license)</div>';
        return;
    }
    el.innerHTML = devices.map(d => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border);">
            <code style="font-size:0.7rem;">${d}</code>
            <button class="btn btn-danger" style="padding:3px 10px; font-size:0.7rem;" onclick="removeDevice('${d}')">Remove</button>
        </div>
    `).join('');
}

async function addDevice() {
    const deviceId = document.getElementById('new-device-input').value.trim();
    if (!deviceId) { showToast('Enter device ID', 'error'); return; }
    await _addDeviceById(deviceId);
}

async function addCurrentDevice() {
    await _addDeviceById(currentDeviceId);
}

async function _addDeviceById(deviceId) {
    try {
        const res = await fetch(`/api/license/${activeLicenseId}/add-device`, {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ device_id: deviceId })
        });
        const data = await res.json();
        if (data.success) {
            showToast('Device added', 'success');
            document.getElementById('new-device-input').value = '';
            const licRes = await fetch('/api/user/licenses', { headers: getHeaders() });
            const licData = await licRes.json();
            const lic = (licData.licenses || []).find(l => l.license_id === activeLicenseId);
            if (lic) renderModalDevices(lic.authorized_devices || []);
        } else {
            showToast(data.error || 'Failed to add device', 'error');
        }
    } catch(e) { showToast('Connection error', 'error'); }
}

async function removeDevice(deviceId) {
    try {
        const res = await fetch(`/api/license/${activeLicenseId}/remove-device`, {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ device_id: deviceId })
        });
        const data = await res.json();
        if (data.success) {
            showToast('Device removed', 'success');
            const licRes = await fetch('/api/user/licenses', { headers: getHeaders() });
            const licData = await licRes.json();
            const lic = (licData.licenses || []).find(l => l.license_id === activeLicenseId);
            if (lic) renderModalDevices(lic.authorized_devices || []);
        }
    } catch(e) { showToast('Error', 'error'); }
}

async function revokeLicense(licenseId) {
    if (!confirm('Are you sure you want to revoke this license? This cannot be undone.')) return;
    try {
        const res = await fetch(`/api/license/${licenseId}/revoke`, { method: 'POST', headers: getHeaders() });
        const data = await res.json();
        if (data.success) { showToast('License revoked', 'success'); loadLicenses(); }
        else showToast(data.error || 'Revoke failed', 'error');
    } catch(e) { showToast('Error', 'error'); }
}

document.addEventListener('DOMContentLoaded', async () => {
    if (!requireAuth()) return;
    document.getElementById('welcome-msg').textContent = 'Welcome, ' + (localStorage.getItem('username') || '');
    currentDeviceId = await computeDeviceFingerprint();
    loadLicenses();
});

document.getElementById('device-modal')?.addEventListener('click', function(e) {
    if (e.target === this) closeDeviceModal();
});
</script>
{% endblock %}
