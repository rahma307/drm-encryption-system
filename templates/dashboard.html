{% extends "base.html" %}
{% block title %}لوحة التحكم — SecureDRM{% endblock %}
{% block content %}

<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;">
    <div>
        <div style="font-family:var(--mono); font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:6px;">SecureDRM / dashboard</div>
        <h1 style="font-size:1.75rem;" id="welcome-msg">مرحباً</h1>
    </div>
    <div style="display:flex; gap:10px;">
        <a href="/encrypt" class="btn">🔒 تشفير ملف</a>
        <a href="/decrypt" class="btn btn-ghost">🔓 فك تشفير</a>
    </div>
</div>

<!-- Stats row -->
<div class="grid-3" id="stats-row" style="margin-bottom:24px;">
    <div class="stat-card">
        <div class="stat-label">إجمالي التراخيص</div>
        <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">تراخيص نشطة</div>
        <div class="stat-value" id="stat-active" style="color:var(--green)">—</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">معرف جهازك</div>
        <div class="stat-value" style="font-size:0.85rem; word-break:break-all;" id="stat-device">—</div>
    </div>
</div>

<!-- Licenses table -->
<div class="card" style="padding:0; overflow:hidden;">
    <div style="padding:20px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;">
        <h2 style="margin:0; color:var(--text); font-size:1rem;">تراخيصك</h2>
        <button class="btn btn-ghost" style="font-size:0.8rem; padding:6px 12px;" onclick="loadLicenses()">↻ تحديث</button>
    </div>
    <div id="licenses-container" style="padding:24px;">
        <div style="text-align:center; color:var(--text-dim); padding:40px; font-family:var(--mono); font-size:0.8rem;">جاري التحميل...</div>
    </div>
</div>

<!-- Device management modal -->
<div id="device-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center;">
    <div class="card" style="width:90%; max-width:480px; max-height:80vh; overflow-y:auto; margin:0;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
            <h2 style="margin:0; color:var(--text); font-size:1rem;">إدارة الأجهزة</h2>
            <button onclick="closeDeviceModal()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.2rem;">✕</button>
        </div>
        <div style="font-family:var(--mono); font-size:0.75rem; color:var(--text-dim); margin-bottom:16px;">
            الترخيص: <span id="modal-license-id" style="color:var(--accent)"></span>
        </div>
        <div id="modal-devices-list" style="margin-bottom:20px;"></div>
        <div style="border-top:1px solid var(--border); padding-top:16px;">
            <label style="margin-bottom:8px; display:block;">إضافة جهاز جديد</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="new-device-input" placeholder="device_id" style="flex:1;">
                <button class="btn" onclick="addDevice()" style="white-space:nowrap; padding:10px 16px;">إضافة</button>
            </div>
            <button class="btn btn-ghost" onclick="addCurrentDevice()" style="width:100%; justify-content:center; margin-top:10px; font-size:0.85rem;">
                📱 إضافة جهازي الحالي
            </button>
        </div>
    </div>
</div>

<script>
// ── Device fingerprint (client-side, persistent) ──
function getDeviceId() {
    let id = localStorage.getItem('device_id');
    if (!id) {
        // Generate a stable fingerprint from available browser signals
        const signals = [
            navigator.userAgent,
            navigator.language,
            screen.width + 'x' + screen.height,
            screen.colorDepth,
            new Date().getTimezoneOffset(),
            navigator.hardwareConcurrency || 0,
            navigator.platform || ''
        ].join('|');
        // Hash it with a random component so it's persistent per browser
        const rand = crypto.getRandomValues(new Uint8Array(8));
        const randHex = Array.from(rand).map(b => b.toString(16).padStart(2,'0')).join('');
        // Use SubtleCrypto for a proper hash
        id = 'dev_' + randHex;
        localStorage.setItem('device_id', id);
    }
    return id;
}

// Compute a stable fingerprint hash using SubtleCrypto
async function computeDeviceFingerprint() {
    const existing = localStorage.getItem('device_fingerprint');
    if (existing) return existing;

    const signals = [
        navigator.userAgent,
        navigator.language,
        screen.width + 'x' + screen.height + 'x' + screen.colorDepth,
        String(new Date().getTimezoneOffset()),
        String(navigator.hardwareConcurrency || 0),
        navigator.platform || '',
        // Add canvas fingerprint
        (() => {
            try {
                const c = document.createElement('canvas');
                const ctx = c.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillText('drm-fingerprint', 2, 2);
                return c.toDataURL().slice(-32);
            } catch(e) { return 'nocanvas'; }
        })()
    ].join('||');

    try {
        const msgBuf = new TextEncoder().encode(signals);
        const hashBuf = await crypto.subtle.digest('SHA-256', msgBuf);
        const hashArr = Array.from(new Uint8Array(hashBuf));
        const fingerprint = 'fp_' + hashArr.map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 32);
        localStorage.setItem('device_fingerprint', fingerprint);
        return fingerprint;
    } catch(e) {
        return getDeviceId();
    }
}

let currentDeviceId = '';
let activeLicenseId = '';

function requireAuth() {
    if (!localStorage.getItem('session_token')) {
        window.location.href = '/login';
        return false;
    }
    return true;
}

function getHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('session_token') };
}

async function loadLicenses() {
    if (!requireAuth()) return;
    try {
        const res = await fetch('/api/user/licenses', { headers: getHeaders() });
        if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; return; }
        const data = await res.json();
        renderLicenses(data.licenses || []);
        updateStats(data.licenses || []);
    } catch(e) {
        document.getElementById('licenses-container').innerHTML = '<p style="color:var(--red); font-family:var(--mono); font-size:0.8rem;">خطأ في تحميل البيانات</p>';
    }
}

function updateStats(licenses) {
    document.getElementById('stat-total').textContent = licenses.length;
    document.getElementById('stat-active').textContent = licenses.filter(l => l.status === 'active').length;
    document.getElementById('stat-device').textContent = currentDeviceId.slice(0, 20) + '...';
}

function statusBadge(status) {
    const map = {
        active: ['badge-green', 'نشط'],
        expired: ['badge-red', 'منتهي'],
        revoked: ['badge-red', 'ملغي'],
        inactive: ['badge-yellow', 'غير نشط'],
        exhausted: ['badge-red', 'استُنفذ']
    };
    const [cls, label] = map[status] || ['badge-blue', status];
    return `<span class="badge ${cls}">${label}</span>`;
}

function renderLicenses(licenses) {
    const el = document.getElementById('licenses-container');
    if (!licenses.length) {
        el.innerHTML = `
            <div style="text-align:center; padding:48px; color:var(--text-dim);">
                <div style="font-size:2rem; margin-bottom:12px;">📭</div>
                <div style="font-family:var(--mono); font-size:0.8rem;">لا توجد تراخيص بعد</div>
                <a href="/encrypt" class="btn" style="margin-top:20px; font-size:0.85rem; padding:8px 16px;">تشفير ملف جديد</a>
            </div>`;
        return;
    }

    const rows = licenses.map(l => {
        const exp = l.expires_at ? new Date(l.expires_at).toLocaleDateString('ar-EG') : '—';
        const uses = l.max_uses === null ? '<span style="color:var(--text-dim)">∞</span>' : `<span style="font-family:var(--mono)">${l.uses_remaining}/${l.max_uses}</span>`;
        const devCount = (l.authorized_devices || []).length;
        const devLabel = devCount === 0
            ? '<span style="color:var(--text-dim); font-size:0.75rem;">عائم</span>'
            : `<span class="badge badge-blue">${devCount} جهاز</span>`;

        return `<tr>
            <td><code>${l.license_id}</code></td>
            <td style="color:var(--text-muted); max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${l.file_name || '—'}</td>
            <td style="font-family:var(--mono); font-size:0.8rem; color:var(--text-muted);">${exp}</td>
            <td>${uses}</td>
            <td>${devLabel}</td>
            <td>${statusBadge(l.status)}</td>
            <td>
                <div style="display:flex; gap:6px;">
                    <button class="btn btn-ghost" style="padding:4px 10px; font-size:0.75rem;" onclick="openDeviceModal('${l.license_id}', ${JSON.stringify(l.authorized_devices || []).replace(/"/g, '&quot;')})">
                        📱 أجهزة
                    </button>
                    ${l.status === 'active' ? `<button class="btn btn-danger" style="padding:4px 10px; font-size:0.75rem;" onclick="revokeLicense('${l.license_id}')">إلغاء</button>` : ''}
                </div>
            </td>
        </tr>`;
    }).join('');

    el.innerHTML = `
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>معرف الترخيص</th>
                        <th>الملف</th>
                        <th>انتهاء الصلاحية</th>
                        <th>الاستخدامات</th>
                        <th>الأجهزة</th>
                        <th>الحالة</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

// ── Device Modal ──
function openDeviceModal(licenseId, devices) {
    activeLicenseId = licenseId;
    document.getElementById('modal-license-id').textContent = licenseId;
    renderModalDevices(devices);
    document.getElementById('device-modal').style.display = 'flex';
}

function closeDeviceModal() {
    document.getElementById('device-modal').style.display = 'none';
    activeLicenseId = '';
    loadLicenses();
}

function renderModalDevices(devices) {
    const el = document.getElementById('modal-devices-list');
    if (!devices.length) {
        el.innerHTML = '<div style="color:var(--text-dim); font-size:0.8rem; font-family:var(--mono); padding:12px 0;">لا توجد أجهزة مرتبطة (ترخيص عائم — أي جهاز مسموح)</div>';
        return;
    }
    el.innerHTML = devices.map(d => `
        <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);">
            <code style="font-size:0.75rem; color:var(--text-muted); word-break:break-all;">${d}</code>
            <button class="btn btn-danger" style="padding:4px 10px; font-size:0.75rem; margin-right:12px; flex-shrink:0;" onclick="removeDevice('${d}')">حذف</button>
        </div>`).join('');
}

async function addDevice() {
    const deviceId = document.getElementById('new-device-input').value.trim();
    if (!deviceId) { showToast('أدخل device_id', 'error'); return; }
    await _addDeviceById(deviceId);
}

async function addCurrentDevice() {
    await _addDeviceById(currentDeviceId);
}

async function _addDeviceById(deviceId) {
    try {
        const res = await fetch(`/api/license/${activeLicenseId}/add-device`, {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ device_id: deviceId })
        });
        const data = await res.json();
        if (data.success) {
            showToast('تم إضافة الجهاز', 'success');
            document.getElementById('new-device-input').value = '';
            // Refresh device list
            const licRes = await fetch('/api/user/licenses', { headers: getHeaders() });
            const licData = await licRes.json();
            const lic = (licData.licenses || []).find(l => l.license_id === activeLicenseId);
            if (lic) renderModalDevices(lic.authorized_devices || []);
        } else {
            showToast(data.error || 'فشل الإضافة', 'error');
        }
    } catch(e) { showToast('خطأ في الاتصال', 'error'); }
}

async function removeDevice(deviceId) {
    try {
        const res = await fetch(`/api/license/${activeLicenseId}/remove-device`, {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ device_id: deviceId })
        });
        const data = await res.json();
        if (data.success) {
            showToast('تم حذف الجهاز', 'success');
            const licRes = await fetch('/api/user/licenses', { headers: getHeaders() });
            const licData = await licRes.json();
            const lic = (licData.licenses || []).find(l => l.license_id === activeLicenseId);
            if (lic) renderModalDevices(lic.authorized_devices || []);
        }
    } catch(e) { showToast('خطأ', 'error'); }
}

async function revokeLicense(licenseId) {
    if (!confirm('هل أنت متأكد من إلغاء هذا الترخيص؟ لا يمكن التراجع.')) return;
    try {
        const res = await fetch(`/api/license/${licenseId}/revoke`, { method: 'POST', headers: getHeaders() });
        const data = await res.json();
        if (data.success) { showToast('تم إلغاء الترخيص', 'success'); loadLicenses(); }
        else showToast(data.error || 'فشل الإلغاء', 'error');
    } catch(e) { showToast('خطأ', 'error'); }
}

document.addEventListener('DOMContentLoaded', async () => {
    if (!requireAuth()) return;
    document.getElementById('welcome-msg').textContent = 'مرحباً، ' + (localStorage.getItem('username') || '');
    currentDeviceId = await computeDeviceFingerprint();
    loadLicenses();
});

// Close modal on backdrop click
document.getElementById('device-modal').addEventListener('click', function(e) {
    if (e.target === this) closeDeviceModal();
});
</script>
{% endblock %}
