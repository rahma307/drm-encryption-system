<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SecureDRM{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080c12;
            --surface: #0d1117;
            --surface-2: #161b22;
            --border: #21262d;
            --border-accent: #30363d;
            --accent: #58a6ff;
            --accent-dim: #1f6feb;
            --accent-glow: rgba(88,166,255,0.12);
            --green: #3fb950;
            --green-glow: rgba(63,185,80,0.12);
            --red: #f85149;
            --yellow: #d29922;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --text-dim: #484f58;
            --mono: 'IBM Plex Mono', monospace;
            --sans: 'Tajawal', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 15px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(88,166,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(88,166,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .navbar {
            background: rgba(13,17,23,0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 56px;
            display: flex;
            align-items: center;
        }

        .navbar-inner {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: var(--mono);
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.02em;
        }

        .logo::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-links a, .nav-btn {
            font-family: var(--sans);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.15s;
            border: none;
            background: none;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-btn:hover {
            color: var(--text);
            background: var(--surface-2);
        }

        .nav-user {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--accent);
            background: var(--accent-glow);
            border: 1px solid rgba(88,166,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            margin-left: 8px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 28px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
            opacity: 0.4;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 8px;
            letter-spacing: -0.03em;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 20px;
            letter-spacing: -0.01em;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-dim);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: var(--sans);
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            letter-spacing: 0.01em;
        }

        .btn:hover {
            background: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(88,166,255,0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border-accent);
            color: var(--text-muted);
        }

        .btn-ghost:hover {
            background: var(--surface-2);
            color: var(--text);
            box-shadow: none;
        }

        .btn-danger {
            background: rgba(248,81,73,0.15);
            border: 1px solid rgba(248,81,73,0.3);
            color: var(--red);
        }

        .btn-danger:hover {
            background: var(--red);
            color: white;
            box-shadow: 0 4px 16px rgba(248,81,73,0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: var(--sans);
            transition: all 0.15s;
        }

        input[type="file"] {
            padding: 8px 12px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-dim);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        code, .mono {
            font-family: var(--mono);
            font-size: 0.8rem;
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border);
            color: var(--accent);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: var(--mono);
        }

        .badge-green { background: var(--green-glow); color: var(--green); border: 1px solid rgba(63,185,80,0.3); }
        .badge-red { background: rgba(248,81,73,0.12); color: var(--red); border: 1px solid rgba(248,81,73,0.3); }
        .badge-yellow { background: rgba(210,153,34,0.12); color: var(--yellow); border: 1px solid rgba(210,153,34,0.3); }
        .badge-blue { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(88,166,255,0.3); }

        .toast-container {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 340px;
            max-width: 500px;
        }

        .toast {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 0.875rem;
            animation: slideIn 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .toast::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
        }

        .toast-success::before { background: var(--green); }
        .toast-error::before { background: var(--red); }
        .toast-info::before { background: var(--accent); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            padding: 10px 14px;
            text-align: right;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

        .stat-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .stat-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
        .stat-value { font-size: 1.75rem; font-weight: 800; font-family: var(--mono); color: var(--text); }

        .footer {
            border-top: 1px solid var(--border);
            text-align: center;
            padding: 24px;
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--text-dim);
            position: relative;
            z-index: 1;
            margin-top: 40px;
        }

        @media (max-width: 640px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .navbar { padding: 0 16px; }
            .container { padding: 24px 16px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="logo">SecureDRM</a>
            <div class="nav-links" id="nav-links">
                <span class="nav-user" id="nav-user" style="display:none"></span>
                <a href="/dashboard" id="link-dashboard" style="display:none">لوحة التحكم</a>
                <a href="/encrypt" id="link-encrypt" style="display:none">تشفير</a>
                <a href="/decrypt" id="link-decrypt" style="display:none">فك تشفير</a>
                <button class="nav-btn" id="link-logout" onclick="doLogout()" style="display:none">خروج</button>
                <a href="/login" id="link-login" class="btn" style="padding:6px 14px; font-size:0.8rem;">دخول</a>
            </div>
        </div>
    </nav>

    <div class="toast-container" id="toast-container"></div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        SecureDRM · AES-256-GCM + RSA-2048 · Zero-metadata file format · Server-enforced DRM
    </div>

    <script>
        function generateDeviceId() {
            let id = localStorage.getItem('device_id');
            if (!id) {
                const nav = navigator.userAgent || '';
                const screenData = `${screen.width}x${screen.height}`;
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
                const raw = `${nav}|${screenData}|${timezone}|${Date.now()}`;
                let hash = 0;
                for (let i = 0; i < raw.length; i++) {
                    hash = ((hash << 5) - hash) + raw.charCodeAt(i);
                    hash |= 0;
                }
                id = 'dev_' + Math.abs(hash).toString(16) + '_' + Date.now().toString(36);
                localStorage.setItem('device_id', id);
            }
            return id;
        }

        function showToast(msg, type = 'info', duration = 5000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type === 'error' ? 'error' : 'success'}`;
            toast.innerHTML = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-4px)';
                toast.style.transition = '0.2s';
                setTimeout(() => toast.remove(), 200);
            }, duration);
        }
        window.showMessage = showToast;

        function getToken() { return localStorage.getItem('session_token'); }
        function getUsername() { return localStorage.getItem('username'); }
        function getDeviceIdFromStorage() { return localStorage.getItem('device_id'); }
        function isLoggedIn() { return !!getToken(); }

        function updateNav() {
            const loggedIn = isLoggedIn();
            const username = getUsername();
            const navUser = document.getElementById('nav-user');
            navUser.textContent = username || '';
            navUser.style.display = loggedIn ? 'inline-flex' : 'none';
            ['link-dashboard','link-encrypt','link-decrypt','link-logout'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = loggedIn ? '' : 'none';
            });
            const loginLink = document.getElementById('link-login');
            if (loginLink) loginLink.style.display = loggedIn ? 'none' : '';
        }

        async function doLogout() {
            const token = getToken();
            if (token) {
                try { await fetch('/api/logout', { method:'POST', headers:{'Authorization':'Bearer '+token} }); } catch(e) {}
            }
            localStorage.clear();
            window.location.href = '/login';
        }

        document.addEventListener('DOMContentLoaded', updateNav);
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
