<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SecureDRM{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c10;
            --surface: #0f1117;
            --surface-2: #181c26;
            --border: #252a33;
            --border-accent: #30363d;
            --accent: #3b82f6;
            --accent-dim: #2563eb;
            --accent-glow: rgba(59,130,246,0.1);
            --green: #10b981;
            --green-glow: rgba(16,185,129,0.08);
            --red: #ef4444;
            --yellow: #f59e0b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --mono: 'IBM Plex Mono', monospace;
            --sans: 'Inter', system-ui, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 15px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 1px 1px, rgba(59,130,246,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .navbar {
            background: rgba(15,17,23,0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
            display: flex;
            align-items: center;
        }

        .navbar-inner {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: var(--mono);
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a, .nav-btn {
            font-family: var(--sans);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 8px;
            transition: all 0.15s;
            border: none;
            background: none;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-btn:hover {
            color: var(--text);
            background: var(--surface-2);
        }

        .nav-user {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--accent);
            background: var(--accent-glow);
            border: 1px solid rgba(59,130,246,0.2);
            padding: 4px 14px;
            border-radius: 20px;
            margin-left: 8px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-dim);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(59,130,246,0.3);
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border-accent);
            color: var(--text-muted);
        }

        .btn-ghost:hover {
            background: var(--surface-2);
            color: var(--text);
            box-shadow: none;
        }

        .btn-danger {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.25);
            color: var(--red);
        }

        .btn-danger:hover {
            background: var(--red);
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.85rem;
            transition: all 0.15s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        code {
            font-family: var(--mono);
            font-size: 0.75rem;
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 5px;
            border: 1px solid var(--border);
            color: var(--accent);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge-green { background: var(--green-glow); color: var(--green); border: 1px solid rgba(16,185,129,0.2); }
        .badge-red { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }
        .badge-yellow { background: rgba(245,158,11,0.1); color: var(--yellow); border: 1px solid rgba(245,158,11,0.2); }
        .badge-blue { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(59,130,246,0.2); }

        .toast-container {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            min-width: 300px;
            max-width: 450px;
        }

        .toast {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 0.85rem;
            margin-bottom: 8px;
            animation: slideIn 0.2s ease;
        }

        .toast::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
        }

        .toast-success::before { background: var(--green); }
        .toast-error::before { background: var(--red); }
        .toast-info::before { background: var(--accent); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            padding: 12px 16px;
            text-align: left;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

        .stat-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
        }

        .stat-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; font-family: var(--mono); color: var(--text); }

        .footer {
            border-top: 1px solid var(--border);
            text-align: center;
            padding: 24px;
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 40px;
        }

        @media (max-width: 640px) {
            .grid-3 { grid-template-columns: 1fr; }
            .navbar { padding: 0 16px; }
            .container { padding: 20px 16px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="logo">SecureDRM</a>
            <div class="nav-links" id="nav-links">
                <span class="nav-user" id="nav-user" style="display:none"></span>
                <a href="/dashboard" id="link-dashboard" style="display:none">Dashboard</a>
                <a href="/encrypt" id="link-encrypt" style="display:none">Encrypt</a>
                <a href="/decrypt" id="link-decrypt" style="display:none">Decrypt</a>
                <button class="nav-btn" id="link-logout" onclick="doLogout()" style="display:none">Logout</button>
                <a href="/login" id="link-login" class="btn" style="padding:5px 16px; font-size:0.8rem;">Sign In</a>
            </div>
        </div>
    </nav>

    <div class="toast-container" id="toast-container"></div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        SecureDRM · Enterprise File Protection · Zero-Metadata Encryption
    </div>

    <script>
        function showToast(msg, type = 'info', duration = 5000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-4px)';
                toast.style.transition = '0.2s';
                setTimeout(() => toast.remove(), 200);
            }, duration);
        }
        window.showMessage = (msg, type) => showToast(msg, type === 'error' ? 'error' : 'success');

        function getToken() { return localStorage.getItem('session_token'); }
        function getUsername() { return localStorage.getItem('username'); }
        function isLoggedIn() { return !!getToken(); }

        function updateNav() {
            const loggedIn = isLoggedIn();
            const username = getUsername();
            const navUser = document.getElementById('nav-user');
            navUser.textContent = username || '';
            navUser.style.display = loggedIn ? 'inline-flex' : 'none';
            ['link-dashboard','link-encrypt','link-decrypt','link-logout'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.style.display = loggedIn ? '' : 'none';
            });
            const loginLink = document.getElementById('link-login');
            if(loginLink) loginLink.style.display = loggedIn ? 'none' : '';
        }

        async function doLogout() {
            const token = getToken();
            if (token) {
                try { await fetch('/api/logout', { method:'POST', headers:{'Authorization':'Bearer '+token} }); } catch(e) {}
            }
            localStorage.clear();
            window.location.href = '/login';
        }

        document.addEventListener('DOMContentLoaded', updateNav);
    </script>
</body>
</html>
