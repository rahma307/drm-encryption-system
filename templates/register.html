{% extends "base.html" %}
{% block title %}إنشاء حساب — SecureDRM{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:40px auto;">
    <div style="font-family:var(--mono); font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:24px;">SecureDRM / register</div>
    <h1 style="font-size:1.5rem; margin-bottom:24px;">إنشاء حساب جديد</h1>

    <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="username" autocomplete="username" placeholder="username">
    </div>
    <div class="form-group">
        <label>البريد الإلكتروني (اختياري)</label>
        <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
        <label>كلمة المرور (8 أحرف على الأقل)</label>
        <input type="password" id="password" autocomplete="new-password" placeholder="••••••••">
    </div>
    <div class="form-group">
        <label>تأكيد كلمة المرور</label>
        <input type="password" id="confirm" autocomplete="new-password" placeholder="••••••••">
    </div>
    <button class="btn" id="reg-btn" onclick="doRegister()" style="width:100%; justify-content:center;">إنشاء الحساب</button>

    <p style="margin-top:20px; text-align:center; color:var(--text-muted); font-size:0.875rem;">
        لديك حساب؟ <a href="/login" style="color:var(--accent);">تسجيل الدخول</a>
    </p>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function doRegister() {
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (!username || !password) { showToast('أدخل اسم المستخدم وكلمة المرور', 'error'); return; }
    if (password !== confirm) { showToast('كلمتا المرور غير متطابقتين', 'error'); return; }
    if (password.length < 8) { showToast('كلمة المرور قصيرة جداً', 'error'); return; }

    const btn = document.getElementById('reg-btn');
    btn.disabled = true; btn.textContent = '...';

    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (data.success) {
            showToast('تم إنشاء الحساب! جارٍ التحويل...', 'success');
            setTimeout(() => window.location.href = '/login', 1500);
        } else {
            showToast(data.error || 'فشل إنشاء الحساب', 'error');
            btn.disabled = false; btn.textContent = 'إنشاء الحساب';
        }
    } catch(e) {
        showToast('خطأ في الاتصال', 'error');
        btn.disabled = false; btn.textContent = 'إنشاء الحساب';
    }
}
</script>
{% endblock %}
