{% extends "base.html" %}
{% block title %}Sign In — SecureDRM{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:40px auto;">
    <div style="font-family:var(--mono); font-size:0.65rem; color:var(--text-dim); letter-spacing:0.1em; margin-bottom:24px;">SECUREDRM / AUTH</div>
    <h1>Sign In</h1>

    <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" autocomplete="username" placeholder="username">
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn" id="login-btn" onclick="doLogin()" style="width:100%;">Sign In</button>

    <p style="margin-top:20px; text-align:center; font-size:0.85rem;">
        No account? <a href="/register" style="color:var(--accent);">Create account</a>
    </p>
</div>

<script>
async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { showToast('Enter username and password', 'error'); return; }

    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = '...';

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('session_token', data.session_token);
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('username', data.username);
            window.location.href = '/dashboard';
        } else {
            showToast(data.error || 'Login failed', 'error');
            btn.disabled = false; btn.textContent = 'Sign In';
        }
    } catch(e) {
        showToast('Connection error', 'error');
        btn.disabled = false; btn.textContent = 'Sign In';
    }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
{% endblock %}
