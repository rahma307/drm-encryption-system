{% extends "base.html" %}
{% block title %}تسجيل الدخول — SecureDRM{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:40px auto;">
    <div style="font-family:var(--mono); font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:24px;">SecureDRM / auth</div>
    <h1 style="font-size:1.5rem; margin-bottom:24px;">تسجيل الدخول</h1>

    <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="username" autocomplete="username" placeholder="username">
    </div>
    <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn" id="login-btn" onclick="doLogin()" style="width:100%; justify-content:center;">دخول</button>

    <p style="margin-top:20px; text-align:center; color:var(--text-muted); font-size:0.875rem;">
        ليس لديك حساب؟ <a href="/register" style="color:var(--accent);">إنشاء حساب</a>
    </p>
</div>

<script>
async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { showToast('أدخل اسم المستخدم وكلمة المرور', 'error'); return; }

    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = '...';

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('session_token', data.session_token);
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('username', data.username);
            window.location.href = '/dashboard';
        } else {
            showToast(data.error || 'فشل تسجيل الدخول', 'error');
            btn.disabled = false; btn.textContent = 'دخول';
        }
    } catch(e) {
        showToast('خطأ في الاتصال', 'error');
        btn.disabled = false; btn.textContent = 'دخول';
    }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
{% endblock %}
